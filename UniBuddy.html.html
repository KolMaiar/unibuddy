<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniBuddy</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1c2a3a;--mut:#5f6f82;--line:#d6dfea;--pri:#1f5fa8;--pri-ink:#fff;--hd:#183a63;--soft:#e8eff8;--ok:#1b7a4b;--okbg:#e6f3ec;--err:#b3261e;--errbg:#fbeceb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0f1826;--card:#16233a;--ink:#e4ebf5;--mut:#9fb0c6;--line:#28405f;--pri:#6aa7ea;--pri-ink:#0b1626;--hd:#0a1220;--soft:#1d2f4b;--ok:#5fcf98;--okbg:#12291f;--err:#ff8f86;--errbg:#33191a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700}
header{background:var(--hd);color:#fff}
.bar{max-width:1000px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font:700 21px Georgia,serif;color:#fff;background:none;border:0;padding:0;cursor:pointer}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:#c9dcf3;font:inherit;font-weight:600;padding:8px 10px;cursor:pointer}
nav button[aria-current="page"]{color:#fff;border-bottom-color:#fff}
.hd{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
header .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
main{max-width:1000px;margin:auto;padding:24px 20px 60px}
h1{font-size:28px;margin:0 0 6px}h2{font-size:20px;margin:0 0 8px}
p.lead{color:var(--mut);margin:0 0 20px}
.hero{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:6px;padding:18px 22px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
.stat span{display:block;color:var(--mut);font-size:13px}.stat b{font:700 30px Georgia,serif;color:var(--pri)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--pri);border:1px solid var(--line)}
button.btn,a.btn{display:inline-block;font:inherit;font-weight:600;border-radius:6px;padding:9px 16px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);cursor:pointer;text-decoration:none}
button.btn.sec{background:none;color:var(--pri)}
button.btn.dng{background:none;color:var(--err);border-color:var(--err)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:8px;margin:0 0 20px;padding:0;list-style:none;flex-wrap:wrap}
.steps li{font-size:14px;font-weight:600;color:var(--mut);padding:4px 12px;border-radius:4px;border:1px solid var(--line);background:var(--card)}
.steps li.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.steps li.done{color:var(--ok);border-color:var(--ok)}
input[type=search],input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
label{display:block;font-weight:600;margin:14px 0 6px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.avatar{width:48px;height:48px;border-radius:6px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font:700 20px Georgia,serif;flex:none}
.tag{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:1px 8px;margin:0 4px 4px 0;display:inline-block}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{font:inherit;font-weight:600;padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-width:84px}
.slot[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.slot:disabled{text-decoration:line-through;opacity:.45;cursor:not-allowed}
.err{color:var(--err);background:var(--errbg);padding:8px 12px;border-radius:6px;margin-top:8px;font-weight:600}
.ok{background:var(--okbg);border:1px solid var(--ok);border-radius:6px;padding:20px}
.ok h1{color:var(--ok)}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:12px 0}dt{color:var(--mut)}dd{margin:0;font-weight:600}
.cls{display:flex;gap:16px;align-items:flex-start;margin-bottom:10px}
.tm{min-width:64px;font-weight:700;color:var(--pri);font-size:18px;line-height:1.2}.tm small{color:var(--mut);font-weight:600;font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-size:13px;font-weight:600;background:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.fac{font-size:13px;color:var(--mut);margin-top:16px}

input[type=time]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.space{margin-top:20px}.space-bottom{margin-bottom:20px}.stats{margin:20px 0}.manage-grid{grid-template-columns:1fr 1fr;align-items:start}.form-actions{margin-top:18px;margin-bottom:8px}.muted{color:var(--mut)}.danger{color:var(--err)}.between{justify-content:space-between}.demo-note{color:var(--mut);font-size:13px;margin:24px auto;max-width:960px}.demo-note details{margin-top:10px}summary{cursor:pointer;font-weight:600}.check{display:flex;align-items:center;gap:8px;font-weight:400}.check input{width:18px;height:18px}fieldset{border:1px solid var(--line);border-radius:6px;margin:18px 0 0;padding:12px}legend{font-weight:600}.record{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}.card.record{padding:18px;margin-bottom:10px}.record:last-child{border-bottom:0}.record p{margin:4px 0}.task{margin-bottom:12px}.task p{margin:10px 0}.status-done{background:var(--okbg);color:var(--ok)}.status-overdue{background:var(--errbg);color:var(--err)}.status-doing{background:var(--soft);color:var(--pri)}.reminder{border-left:4px solid var(--pri)}.calendar-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:16px}.cal-label{text-align:center;color:var(--mut);font-size:13px;padding:6px 0}.cal-day{position:relative;min-height:57px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;text-align:left;padding:7px}.cal-selected{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.cal-today{box-shadow:inset 0 0 0 2px var(--pri)}.cal-dot{display:block;font-size:11px;font-weight:bold}.agenda{border-top:1px solid var(--line);padding:16px 0}.agenda h3{font-size:16px;margin:8px 0}.multiline{white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:var(--mut);text-align:center;padding:24px}.btn,.chip{white-space:normal}td,dd,.card{overflow-wrap:anywhere}nav button{font-size:14px}.bar{max-width:1120px}
@media(max-width:650px){.manage-grid,.calendar-layout{grid-template-columns:1fr}.bar{gap:8px;padding:12px}.hd{margin-left:0}nav{order:3;width:100%}nav button{padding:8px}main{padding:20px 12px 40px}.cal-day{min-height:48px;padding:5px}.calendar-grid{gap:3px}.record{flex-wrap:wrap}dl{grid-template-columns:1fr}dd{margin-bottom:8px}.card{padding:14px}h1{font-size:26px}}

.chat-list{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin-bottom:10px;background:var(--bg)}.msg{padding:8px 0;border-bottom:1px solid var(--line)}.msg:last-child{border-bottom:0}.msg.me{border-left:3px solid var(--pri);padding-left:8px}.msg .chip{padding:0 8px;font-size:13px}
#dbst[data-s=err]{background:#b3261e!important;border-color:#b3261e!important}#dbst[data-s=wait]{opacity:.7}#dbst[data-s=off]{border-style:dashed}

async function H(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')}
// Passwords are stored as salted SHA-256 hashes (salt = user id), never as plain text in the database.
async function hashPw(){if(!(window.crypto&&crypto.subtle))return 0;var ch=0,all=DB.students.concat(DB.teachers);for(var i=0;i<all.length;i++){var x=all[i];if(x.password&&x.password.slice(0,5)!==PF){x.password=PF+await H(x.id+':'+x.password);ch=1}}return ch}
function dbErr(e){toast(e&&e.code==='invalid_argument'?tr('Нет прав на запись. Попроси владельца дать доступ «Участник».','No write access. Ask the owner for Contributor access.'):tr('Ошибка базы данных: ','Database error: ')+((e&&e.code)||''))}
function pill(){var e=$('dbst');if(!e)return;var m=!DBX?['off',tr('Автономно','Offline')]:ERRS?['err',tr('Ошибка сохранения','Save error')]:(WQ.length||WB)?['wait',tr('Сохраняю…','Saving…')]:['ok',tr('База подключена','Database connected')];e.textContent='● '+m[1];e.dataset.s=m[0]}
function dbw(k,fn,undo){WQ.push({fn:fn,undo:undo});pill();drain()}
async function drain(){if(WB)return;WB=1;
 while(WQ.length){var j=WQ[0],ok=0,err=null;
  for(var a=0;a<4&&!ok;a++){try{await j.fn();ok=1}catch(e){err=e;if(e&&(e.code==='invalid_argument'||e.code==='quota_exceeded'))break;await new Promise(function(r){setTimeout(r,400*(a+1))})}}
  WQ.shift();if(ok)ERRS=0;else{ERRS=1;if(j.undo)j.undo();dbErr(err)}pill()}
 WB=0;pill();
 if(RESYNC){RESYNC=0;var sn=SNAP;SNAP={};Object.keys(sn).forEach(function(n){adopt(n,sn[n])});soft()}}
function cmp(a,b){var x=a.id,y=b.id,p=typeof x==='number',q=typeof y==='number';return p&&q?x-y:p?-1:q?1:String(x)<String(y)?-1:1}
function adopt(n,snap){var rows=snap.docs.map(function(d){return JSON.parse(JSON.stringify(d.data()))}).sort(cmp);holder(n)[n]=rows;SY[n]={};rows.forEach(function(x){SY[n][String(x.id)]=JSON.stringify(x)})}
// One document per record; only changed/removed records are written.
function dbPush(){if(!DBX||!LIVE)return;Object.keys(COLS).forEach(function(n){var seen={},m=SY[n],c=COLS[n];
 holder(n)[n].forEach(function(x){var id=String(x.id),j=JSON.stringify(x);seen[id]=1;if(m[id]!==j){m[id]=j;dbw(c+'/'+id,function(){return DBX.doc(c+'/'+id).set(JSON.parse(j))},function(){if(SY[n])delete SY[n][id]})}});
 Object.keys(m).forEach(function(id){if(!seen[id]){var old=m[id];delete m[id];dbw(c+'/'+id,function(){return DBX.doc(c+'/'+id).delete()},function(){if(SY[n])SY[n][id]=old})}})})}
function soft(){clearTimeout(soft.h);soft.h=setTimeout(function(){if(S.u&&!app.querySelector('input:focus,textarea:focus,select:focus'))render(1)},200)}
async function dbInit(){
 try{DBX=window.claude&&claude.use?await claude.use('db'):null}catch(e){DBX=null}
 if(!DBX){SYNCING=false;return}
 try{
  var meta=await DBX.doc('meta/init').get(),first={},keys=Object.keys(COLS),need=keys.length;
  await new Promise(function(ok,bad){keys.forEach(function(n){var got=0;DBX.collection(COLS[n]).onSnapshot(function(s){if(!LIVE){first[n]=s;if(!got){got=1;if(--need===0)ok()}}else{if(WQ.length||WB){SNAP[n]=s;RESYNC=1}else{adopt(n,s);soft()}}},bad)})});
  var empty=keys.every(function(n){return !first[n].size});
  if(meta.exists||!empty)keys.forEach(function(n){adopt(n,first[n])});
  else{await hashPw();keys.forEach(function(n){SY[n]={}})}
  LIVE=true;SYNCING=false;pill();
  if(!meta.exists){dbw('meta/init',function(){return DBX.doc('meta/init').set({at:Date.now()})});if(empty){baseSave();dbPush()}}
  render(1)
 }catch(e){DBX=null;LIVE=false;SYNCING=false;pill();toast(tr('База данных недоступна — работаю локально.','Database unavailable — working locally.'))}
}
var baseSave=save;
save=function(){var ok;if(LIVE){var tt=toast;toast=function(){};try{baseSave()}finally{toast=tt}ok=true}else ok=baseSave();if(ok)hashPw().catch(function(){return 0}).then(function(c){if(c)baseSave();dbPush()});return ok};

// ----- Group chat: one document per message, last 300 kept per group -----
function chatList(){return CH.msgs.length?CH.msgs.map(function(m){return '<div class="msg'+(m.uid===S.userId?' me':'')+'"><b>'+esc(m.name)+'</b> <small class="muted">'+new Date(m.ts).toLocaleString(loc(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</small>'+(m.uid===S.userId||isStaff()?' <button type="button" class="chip" data-c="del" data-id="'+esc(m.id)+'" aria-label="'+t('del')+'">×</button>':'')+'<div class="multiline">'+esc(m.text)+'</div></div>'}).join(''):'<p class="muted">'+tr('Пока нет сообщений. Напиши первым!','No messages yet. Be the first!')+'</p>'}
function chatCard(gid){return '<section class="card space" id="chat"><h2>'+tr('Чат группы: ','Group chat: ')+esc(groupName(gid))+'</h2>'+(DBX?'<div id="chat-list" class="chat-list">'+chatList()+'</div><div class="row"><input id="chat-in" type="text" maxlength="500" autocomplete="off" placeholder="'+tr('Напиши сообщение…','Write a message…')+'" style="flex:1;min-width:160px"><button type="button" class="btn" data-c="send">'+tr('Отправить','Send')+'</button></div>':'<p class="muted">'+tr('Чат работает при подключении к общей базе данных.','The chat needs the shared database connection.')+'</p>')+'</section>'}
function chatClose(){if(CH.un)CH.un();CH.un=null;CH.gid=null;CH.msgs=[]}
function chatOpen(gid){if(!DBX)return;var l=$('chat-list');if(CH.gid===gid){if(l)l.scrollTop=l.scrollHeight;return}chatClose();CH.gid=gid;
 CH.un=DBX.collection('chats/'+gid+'/messages').orderBy('ts','desc').limit(100).onSnapshot(function(s){CH.msgs=s.docs.map(function(d){return d.data()}).reverse();var l2=$('chat-list');if(l2){l2.innerHTML=chatList();l2.scrollTop=l2.scrollHeight}},function(){CH.gid=null})}
function chatSend(){var i=$('chat-in');if(!i||!CH.gid)return;var text=i.value.trim();if(!text)return;
 var me=S.u==='student'?current()?.name:S.u==='teacher'?teacher(S.userId)?.name:tr('Администратор','Administrator'),id=uid(),base='chats/'+CH.gid+'/messages';i.value='';
 dbw(base+'/'+id,function(){return DBX.doc(base+'/'+id).set({id:id,gid:CH.gid,uid:S.userId,name:me||'?',text:text.slice(0,500),ts:Date.now()})});
 if(Math.random()<0.1)DBX.collection(base).orderBy('ts','desc').limit(400).get().then(function(s){s.docs.slice(300).forEach(function(d){dbw(base+'/'+d.id,function(){return DBX.doc(base+'/'+d.id).delete()})})}).catch(function(){})}
document.addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b||!DBX||!CH.gid)return;
 if(b.dataset.c==='send')chatSend();
 if(b.dataset.c==='del'){var p='chats/'+CH.gid+'/messages/'+b.dataset.id;dbw(p,function(){return DBX.doc(p).delete()})}});
document.addEventListener('keydown',function(e){if(e.target.id==='chat-in'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();chatSend()}});
var renderNoChat=render;
render=function(k){renderNoChat(k);pill();
 var gid=S.u==='student'&&S.v==='prof'?current()?.groupId:S.u&&isStaff()&&S.v==='tp'?UX.group:'',dn=app.querySelector('.demo-note'),on=DBX&&LIVE;
 if(dn)dn.textContent=on?(S.u?tr('Общая база данных подключена · изменения видят все пользователи.','Shared database connected · everyone sees changes.'):tr('Аккаунты создаёт администратор · данные хранятся в общей базе.','Accounts are created by the administrator · data is stored in a shared database.')):tr('Автономный режим · данные только в этом браузере.','Offline mode · data stays in this browser only.');
 if(!gid){chatClose();if(S.u==='student'&&S.v==='prof'){var nd='<section class="card space"><h2>'+tr('Чат группы','Group chat')+'</h2><p class="muted">'+tr('Тебя ещё не добавили в группу. Чат появится, когда администратор назначит группу.','You are not in a group yet. The chat appears once the administrator assigns one.')+'</p></section>';dn?dn.insertAdjacentHTML('beforebegin',nd):app.insertAdjacentHTML('beforeend',nd)}return}
 var html=chatCard(gid);dn?dn.insertAdjacentHTML('beforebegin',html):app.insertAdjacentHTML('beforeend',html);chatOpen(gid)};

load();render();dbInit();
</script>
